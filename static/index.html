<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%234dd4ff' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%234dd4ff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="stage">

  <!-- corner HUD -->
  <header class="hud hud-tl">
    <span class="orbdot" id="hudDot"></span>
    <span class="wordmark">JARVIS</span>
  </header>

  <div class="hud hud-tr">
    <div class="readout"><span class="lbl">SYS.STATUS</span><span class="val" id="sysStatus">OPTIMAL</span></div>
    <div class="readout"><span class="lbl">BRAIN</span><span class="val" id="sysBrain">–</span></div>
    <div class="readout"><span class="lbl">MODE</span><span class="val" id="sysMode">DASHBOARD</span></div>
  </div>

  <div class="hud hud-bl">
    <div class="wm-big">JARVIS</div>
    <div class="wm-sub" id="stateLabel">v2.0 // standby</div>
  </div>

  <!-- top-right controls -->
  <nav class="controls">
    <button class="icon-btn" id="railToggle" title="Activity log & notifications" aria-label="Toggle activity panel">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
      <span class="badge hidden" id="railBadge">0</span>
    </button>
    <a class="icon-btn" href="/settings" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 15.5a3.5 3.5 0 100-7 3.5 3.5 0 000 7z" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M19.4 13a7.6 7.6 0 000-2l2-1.6-2-3.4-2.4 1a7.6 7.6 0 00-1.7-1l-.4-2.5h-4l-.4 2.5a7.6 7.6 0 00-1.7 1l-2.4-1-2 3.4L4.6 11a7.6 7.6 0 000 2l-2 1.6 2 3.4 2.4-1a7.6 7.6 0 001.7 1l.4 2.5h4l.4-2.5a7.6 7.6 0 001.7-1l2.4 1 2-3.4z" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>
    </a>
  </nav>

  <!-- the orb -->
  <main class="core">
    <canvas id="orb" class="orb-canvas" aria-hidden="true"></canvas>
    <div class="conversation" id="conversation"></div>
  </main>

  <!-- composer -->
  <footer class="dock">
    <div class="prompt-hint" id="promptHint">Say "Hey JARVIS" — or just start typing.</div>
    <form class="composer" id="composer">
      <input type="text" id="input" placeholder="Message JARVIS…" autocomplete="off" autofocus>
      <button type="button" class="mic-btn" id="speakToggle" title="Voice replies: on" aria-label="Toggle spoken replies">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M11 5L6 9H3v6h3l5 4V5z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 010 7M18 6a8.5 8.5 0 010 12" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
      </button>
      <button type="submit" class="send-btn" aria-label="Send">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 12h15M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </form>
  </footer>

  <!-- slide-in activity rail -->
  <aside class="rail" id="rail" aria-hidden="true">
    <div class="rail-head">
      <span>Activity</span>
      <button class="icon-btn ghost" id="railClose" aria-label="Close panel">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="rail-tabs">
      <button class="tab active" data-tab="log">Action log</button>
      <button class="tab" data-tab="notif">Notifications</button>
    </div>
    <div class="rail-body">
      <div class="tabpane active" id="pane-log">
        <div class="feed" id="feed"><p class="empty">No actions yet. Everything JARVIS does shows up here.</p></div>
      </div>
      <div class="tabpane" id="pane-notif">
        <div class="notifs" id="notifs"><p class="empty">No notifications. Alerts appear here — never spoken aloud.</p></div>
      </div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

</div>

<div class="modal-veil hidden" id="confirmVeil">
  <div class="modal" role="alertdialog" aria-labelledby="confirmDesc">
    <div class="head">Confirmation required</div>
    <div class="desc" id="confirmDesc"></div>
    <div class="actions">
      <button class="btn ghost" id="denyBtn">Deny</button>
      <button class="btn warn" id="allowBtn">Allow</button>
    </div>
  </div>
</div>

<script src="/static/orb.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
