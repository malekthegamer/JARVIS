<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%235cc8ff' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%235cc8ff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="shell">
  <header class="bar">
    <div class="wordmark">J<span>A</span>RVIS</div>
    <div class="arc-wrap">
      <div class="arc" id="arc"></div>
      <div class="status-word" id="statusWord">idle</div>
    </div>
    <div class="spacer"></div>
    <button class="btn quiet" id="speakToggle" title="Speak replies aloud on this PC">🔊 voice replies: off</button>
    <button class="btn quiet" id="resetBtn" title="Clear this conversation">clear</button>
    <a class="navlink" href="/settings">SETTINGS</a>
  </header>

  <div class="main">
    <div class="chat-col">
      <div class="messages" id="messages">
        <div class="empty-hint" id="emptyHint">
          <div class="big">At your service</div>
          <div>Ask anything, or tell me what to do on this machine.</div>
        </div>
      </div>
      <form class="composer" id="composer">
        <input type="text" id="input" placeholder="Ask JARVIS…" autocomplete="off" autofocus>
        <button type="submit" class="btn">Send</button>
      </form>
    </div>

    <aside class="rail">
      <h2>Systems</h2>
      <div class="providers" id="providers">
        <div><span class="k">brain</span><span class="v" id="pBrain">–</span></div>
        <div><span class="k">voice in</span><span class="v" id="pStt">–</span></div>
        <div><span class="k">voice out</span><span class="v" id="pTts">–</span></div>
      </div>
      <h2>Action log</h2>
      <div class="feed" id="feed"><div class="empty">No actions yet — everything JARVIS does will be logged here.</div></div>
      <h2>Notifications</h2>
      <div class="notifs" id="notifs"></div>
    </aside>
  </div>
</div>

<div class="modal-veil hidden" id="confirmVeil">
  <div class="modal" role="alertdialog" aria-labelledby="confirmDesc">
    <div class="head">Confirmation required</div>
    <div class="desc" id="confirmDesc"></div>
    <div class="actions">
      <button class="btn quiet" id="denyBtn">Deny</button>
      <button class="btn warn" id="allowBtn">Allow</button>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
