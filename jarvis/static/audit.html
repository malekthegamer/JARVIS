<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS — Audit Log</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%233BE8FF' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%233BE8FF'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/audit.css">
</head>
<body>
<div class="shell">
  <header class="bar">
    <div class="wordmark">J<span>A</span>RVIS</div>
    <div class="arc-wrap"><div class="arc"></div><div class="status-word">audit log</div></div>
    <div class="spacer"></div>
    <a class="navlink" href="/">← BACK TO CHAT</a>
  </header>

  <div class="audit-wrap">
    <p class="lede">The durable record of every action JARVIS took — which tool,
      which safety tier, whether it was confirmed, and how it ended. The verbatim
      arguments stay encrypted until you reveal a specific record.</p>

    <div class="controls">
      <label>Tier
        <select id="fTier">
          <option value="">all</option>
          <option value="auto">auto</option>
          <option value="confirm">confirm</option>
          <option value="blocked">blocked</option>
        </select>
      </label>
      <label>Status
        <select id="fStatus">
          <option value="">all</option>
          <option value="ok">ok</option>
          <option value="failed">failed</option>
          <option value="cancelled">cancelled</option>
        </select>
      </label>
      <label>Tool <input type="text" id="fTool" placeholder="filter by tool…"></label>
      <label>Show
        <select id="fTail">
          <option value="100">last 100</option>
          <option value="200" selected>last 200</option>
          <option value="500">last 500</option>
          <option value="5000">everything</option>
        </select>
      </label>
      <button id="refresh" type="button">↻ refresh</button>
      <span class="count" id="count"></span>
    </div>

    <div class="table-head">
      <span class="c-ts">time (UTC)</span>
      <span class="c-tool">tool</span>
      <span class="c-tier">tier</span>
      <span class="c-status">status</span>
      <span class="c-gate">gate</span>
      <span class="c-rev"></span>
    </div>
    <ol class="audit-list" id="audit-list"></ol>
    <p class="empty hidden" id="audit-empty">No audit records yet.</p>
  </div>
</div>
<script src="/static/audit.js"></script>
</body>
</html>
